[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suas-autonomy"
version = "0.1.0"
description = "Hardware-independent autonomy development tools for a fixed-wing SUAS aircraft"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pymavlink>=2.4.42,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["suas_autonomy*"]

[tool.pytest.ini_options]
testpaths = ["suas_autonomy/tests"]
addopts = "-q"
